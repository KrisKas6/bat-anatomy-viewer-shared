name: Desktop installation and video saving
on:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/platform-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2022, windows-11-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install, launch, and save MP4 and MOV
        env:
          PYTHONUTF8: '1'
        run: python scripts/verify_platforms.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: platform-report-${{ matrix.os }}
          path: platform-test-report.json
          if-no-files-found: ignore
